name: Monorepo CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # -------------------------------------------------------------
  # 1. REACT FRONTEND
  # -------------------------------------------------------------
  verify-frontend:
    name: Verify React Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: react-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

  # -------------------------------------------------------------
  # 2. BACKEND (Spring Boot / Java)
  # -------------------------------------------------------------
  verify-backend:
    name: Verify Main Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/Ai-Study-Assistant-Backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21' 
          cache: 'maven'

      - name: Verify Build
        run: ./mvnw clean compile

  # -------------------------------------------------------------
  # 3. AI PYTHON SERVICE (Using Dev Container & Pytest)
  # -------------------------------------------------------------
  verify-ai-service:
    name: Verify AI Python Service (Dev Container)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Dev Container and Run Tests
        uses: devcontainers/ci@v0.3
        with:
          # Tells GitHub where to find your .devcontainer folder
          subfolder: Ai-python-service 
          # The commands to run INSIDE your dev container once it boots up
          runCmd: |
            # Install the testing tools on top of your existing requirements
            pip install pytest pytest-mock httpx
            
            # Verify syntax in the src directory
            python -m compileall src/
            
            # Run the 5 tests with PYTHONPATH set to the current directory 
            # so 'from src.api import app' works perfectly
            PYTHONPATH=. pytest tests/